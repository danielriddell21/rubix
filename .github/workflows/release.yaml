name: Release

on:
  push:
    tags: ["v*"]

jobs:
  goreleaser:
    # macOS so the cgo/Metal darwin binary can be built natively; a Linux
    # clang cannot cross-build one.
    uses: danielriddell21/github-actions/.github/workflows/release.yaml@v1
    permissions:
      contents: write
    with:
      runs-on: macos-latest
    secrets:
      tap-app-private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
